<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>The Dancing Librarian</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <a class="skip-link" href="#main">Skip to content</a>

    <main id="main">
      <div class="wrap">
        <section class="hero" aria-label="The Dancing Librarian hero section">
          <div class="hero-inner">
            <div>
              <h1 id="hero-heading" class="title">The Dancing Librarian</h1>

              <p class="bio">
                Jeremiah King applies his unique background in dance and Latin
                to the fields of digital librarianship and data visualization,
                supporting in-person and online scholarship, teaching, and
                research.
              </p>

              <div class="social" aria-label="Social links">

                  class="icon-btn icon-btn-email"
                  href="mailto:jeremiah@utk.edu"
                  aria-label="Email Jeremiah"
                >

                      d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Zm0 4.2-8 5.2-8-5.2V6l8 5.2L20 6v2.2Z"
                    />

                </a>

                  class="icon-btn icon-btn-linkedin"
                  href="https://www.linkedin.com/in/jeremiahjking"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Jeremiah on LinkedIn"
                >

                      d="M20.45 20.45H17V14.9c0-1.32-.03-3.02-1.84-3.02-1.84 0-2.12 1.44-2.12 2.92v5.65H9.6V9h3.3v1.6h.04c.46-.87 1.6-1.79 3.3-1.79 3.53 0 4.18 2.33 4.18 5.36v6.28ZM5.34 7.43a1.93 1.93 0 1 1 0-3.86 1.93 1.93 0 0 1 0 3.86ZM7.07 20.45H3.61V9h3.46v11.45Z"

                <a
                  class="icon-btn icon-btn-orchid"
                  href="#"
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Orchid"
                >

                    <path

              </div>

              <div class="hint" role="note">
                Tip: Hover (or focus) the hero image to see it swap.
              </div>
            </div>

            <div class="media" aria-label="Hero image">
              <div class="avatar-swap" tabindex="0">
                <img
                  class="avatar avatar-a"
                  src="dancinglibrarianlogoblue.png"
                  alt="Hero image"
                />
                <img
                  class="avatar avatar-b"
                  src="jksmimage.jpg"
                  alt=""
                  aria-hidden="true"
                />

            </div>

    <script src="script.js"></script>
