<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title>The Dancing Librarian</title>
  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <main id="main">
    <div class="wrap">
      <section class="hero" aria-label="The Dancing Librarian hero section">

            <h1 id="hero-heading" class="title">The Dancing Librarian</h1>

            <p class="bio">

              data visualization, supporting in-person and online scholarship, teaching, and research.
            </p>

                  <path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.19-3.37-1.19-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.36 1.09 2.94.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.95 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.64 0 0 .84-.27 2.75 1.02a9.55 9.55 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.37.2 2.39.1 2.64.64.7 1.03 1.59 1.03 2.68 0 3.85-2.34 4.7-4.57 4.95.36.31.68.92.68 1.86v2.75c0 .26.18.58.69.48A10 10 0 0 0 12 2Z"/>

              <a class="icon-btn icon-btn-discord"
                 href="https://discord.gg/jeremiahking"
                 target="_blank" rel="noopener noreferrer"
                 aria-label="Jeremiah on Discord">

            </div>
          </div>

          <div class="media" aria-label="Hero image">
            <div class="avatar-swap" tabindex="0">
              <img class="avatar avatar-a" src="dancinglibrarian-logo-blue.png" alt="Hero image" />
              <img class="avatar avatar-b" src="jksmimage.jpg" alt="" aria-hidden="true" />
            </div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script src="script.js"></script>

</html>
